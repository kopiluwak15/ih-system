<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アカウント発行 - CEO ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      padding: 48px 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: #cbd5e1;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-section-title {
      font-size: 12px;
      font-weight: 700;
      color: #3b82f6;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: block;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #475569;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s ease;
      background: rgba(59, 130, 246, 0.02);
      color: #f1f5f9;
    }

    input[type="text"]::placeholder,
    input[type="email"]::placeholder,
    input[type="password"]::placeholder,
    textarea::placeholder {
      color: #64748b;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.08);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 8px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: #3b82f6;
    }

    .checkbox-group label {
      margin: 0;
      font-size: 13px;
      color: #cbd5e1;
      cursor: pointer;
      line-height: 1.5;
    }

    .checkbox-group a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }

    .checkbox-group a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    button {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.5);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(59, 130, 246, 0.6);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
      border: 1px solid #475569;
    }

    .btn-secondary:hover {
      background: #475569;
      border-color: #64748b;
    }

    .login-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .login-link a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .success-message {
      background: rgba(16, 185, 129, 0.15);
      color: #86efac;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: none;
      text-align: center;
      font-size: 14px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .success-message.show {
      display: block;
    }

    .password-requirements {
      background: rgba(59, 130, 246, 0.05);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 6px;
      padding: 12px;
      margin-top: 8px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .requirement {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .requirement:last-child {
      margin-bottom: 0;
    }

    .requirement.met {
      color: #86efac;
    }

    .requirement.unmet {
      color: #64748b;
    }

    .requirement-icon {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo">🎯</div>
        <h1 class="title">CEO ダッシュボード</h1>
        <p class="subtitle">アカウント発行</p>
      </div>

      <div class="success-message" id="successMessage">
        ✅ アカウントが正常に作成されました！
      </div>

      <form id="accountForm">
        <!-- 組織情報セクション -->
        <span class="form-section-title">📊 組織情報</span>

        <div class="form-group">
          <label for="orgName">組織名 <span style="color: #ef5350;">*</span></label>
          <input type="text" id="orgName" placeholder="例：IH-SYSTEM" required>
          <div class="error-message" id="orgNameError"></div>
        </div>

        <div class="form-group">
          <label for="orgDesc">組織の説明</label>
          <textarea id="orgDesc" placeholder="例：東京・渋谷を拠点にした理美容チェーン店"></textarea>
        </div>

        <!-- 管理者情報セクション -->
        <span class="form-section-title" style="margin-top: 32px;">👤 管理者ユーザー</span>

        <div class="form-group">
          <label for="adminName">管理者名 <span style="color: #ef5350;">*</span></label>
          <input type="text" id="adminName" placeholder="例：黒田太郎" required>
          <div class="error-message" id="adminNameError"></div>
        </div>

        <div class="form-group">
          <label for="adminEmail">メールアドレス <span style="color: #ef5350;">*</span></label>
          <input type="email" id="adminEmail" placeholder="例：admin@company.com" required>
          <div class="error-message" id="adminEmailError"></div>
        </div>

        <div class="form-group">
          <label for="adminPassword">パスワード <span style="color: #ef5350;">*</span></label>
          <input type="password" id="adminPassword" placeholder="8文字以上、大文字・数字を含める" required>
          <div class="error-message" id="adminPasswordError"></div>
          <div class="password-requirements">
            <div class="requirement unmet" id="req-length">
              <span class="requirement-icon">○</span>
              <span>8文字以上</span>
            </div>
            <div class="requirement unmet" id="req-uppercase">
              <span class="requirement-icon">○</span>
              <span>大文字を含む</span>
            </div>
            <div class="requirement unmet" id="req-number">
              <span class="requirement-icon">○</span>
              <span>数字を含む</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="adminPasswordConfirm">パスワード（確認） <span style="color: #ef5350;">*</span></label>
          <input type="password" id="adminPasswordConfirm" placeholder="パスワードを再度入力してください" required>
          <div class="error-message" id="adminPasswordConfirmError"></div>
        </div>

        <!-- 利用規約セクション -->
        <div class="form-group" style="margin-top: 32px;">
          <div class="checkbox-group">
            <input type="checkbox" id="termsCheckbox" required>
            <label for="termsCheckbox">
              <a href="#" onclick="alert('利用規約の詳細です。実装予定。'); return false;">利用規約</a>に同意します
            </label>
          </div>
          <div class="error-message" id="termsError"></div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="privacyCheckbox" required>
          <label for="privacyCheckbox">
            <a href="#" onclick="alert('プライバシーポリシーの詳細です。実装予定。'); return false;">プライバシーポリシー</a>に同意します
          </label>
        </div>
        <div class="error-message" id="privacyError"></div>

        <!-- ボタン -->
        <div class="button-group">
          <button type="submit" class="btn-primary">アカウント作成</button>
        </div>

        <div class="login-link">
          既にアカウントをお持ちですか？<br>
          <a href="#" onclick="alert('ログイン機能は実装予定です。'); return false;">ここからログイン</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script>
    /**
     * アカウント発行ページのスクリプト
     * Supabase統合版
     */

    const form = document.getElementById('accountForm');
    const passwordInput = document.getElementById('adminPassword');

    // パスワード要件チェック
    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;

      // 8文字以上
      const lengthReq = document.getElementById('req-length');
      if (password.length >= 8) {
        lengthReq.classList.remove('unmet');
        lengthReq.classList.add('met');
      } else {
        lengthReq.classList.remove('met');
        lengthReq.classList.add('unmet');
      }

      // 大文字を含む
      const uppercaseReq = document.getElementById('req-uppercase');
      if (/[A-Z]/.test(password)) {
        uppercaseReq.classList.remove('unmet');
        uppercaseReq.classList.add('met');
      } else {
        uppercaseReq.classList.remove('met');
        uppercaseReq.classList.add('unmet');
      }

      // 数字を含む
      const numberReq = document.getElementById('req-number');
      if (/[0-9]/.test(password)) {
        numberReq.classList.remove('unmet');
        numberReq.classList.add('met');
      } else {
        numberReq.classList.remove('met');
        numberReq.classList.add('unmet');
      }
    });

    // フォーム送信
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // バリデーション
      const errors = validateForm();
      if (Object.keys(errors).length > 0) {
        displayErrors(errors);
        return;
      }

      // エラーをクリア
      clearErrors();

      // アカウント情報を取得
      const orgName = document.getElementById('orgName').value;
      const orgDesc = document.getElementById('orgDesc').value;
      const adminName = document.getElementById('adminName').value;
      const adminEmail = document.getElementById('adminEmail').value;

      try {
        // ローカル ID 生成（UUID 類似）
        const organizationId = 'org_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

        const organization = {
          id: organizationId,
          name: orgName,
          description: orgDesc,
          created_at: new Date().toISOString()
        };

        // Supabaseへの保存は試みるが失敗してもOK（RLS回避）
        try {
          await supabase.createOrganization(orgName, orgDesc);
        } catch (supabaseError) {
          console.warn('⚠️ Supabase save skipped:', supabaseError.message);
          // RLS ポリシーエラーを許可：ローカルストレージに保存して進める
        }

        // localStorage に保存
        localStorage.setItem('organizationId', organizationId);
        localStorage.setItem('organization', JSON.stringify(organization));
        localStorage.setItem('admin', JSON.stringify({
          name: adminName,
          email: adminEmail,
          role: 'CEO',
        }));
        localStorage.setItem('accountId', 'account_' + organizationId);
        localStorage.setItem('currentOrgId', organizationId);

        // 成功メッセージを表示
        const successMessage = document.getElementById('successMessage');
        successMessage.textContent = '✅ アカウントが正常に作成されました！ダッシュボードに移動します...';
        successMessage.classList.add('show');

        // 2秒後に CEO ダッシュボードにリダイレクト
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);

      } catch (error) {
        console.error('Account creation error:', error);
        // エラーメッセージを表示
        const errorMsg = error.message || 'アカウント作成中にエラーが発生しました。もう一度お試しください。';
        alert(errorMsg);
      }
    });

    /**
     * フォームバリデーション
     */
    function validateForm() {
      const errors = {};

      // 組織名
      const orgName = document.getElementById('orgName').value.trim();
      if (!orgName) {
        errors.orgName = '組織名を入力してください';
      } else if (orgName.length < 2) {
        errors.orgName = '組織名は2文字以上である必要があります';
      }

      // 管理者名
      const adminName = document.getElementById('adminName').value.trim();
      if (!adminName) {
        errors.adminName = '管理者名を入力してください';
      } else if (adminName.length < 2) {
        errors.adminName = '管理者名は2文字以上である必要があります';
      }

      // メールアドレス
      const adminEmail = document.getElementById('adminEmail').value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!adminEmail) {
        errors.adminEmail = 'メールアドレスを入力してください';
      } else if (!emailRegex.test(adminEmail)) {
        errors.adminEmail = '有効なメールアドレスを入力してください';
      }

      // パスワード
      const adminPassword = document.getElementById('adminPassword').value;
      if (!adminPassword) {
        errors.adminPassword = 'パスワードを入力してください';
      } else if (adminPassword.length < 8) {
        errors.adminPassword = 'パスワードは8文字以上である必要があります';
      } else if (!/[A-Z]/.test(adminPassword)) {
        errors.adminPassword = 'パスワードに大文字を含める必要があります';
      } else if (!/[0-9]/.test(adminPassword)) {
        errors.adminPassword = 'パスワードに数字を含める必要があります';
      }

      // パスワード確認
      const adminPasswordConfirm = document.getElementById('adminPasswordConfirm').value;
      if (!adminPasswordConfirm) {
        errors.adminPasswordConfirm = 'パスワード（確認）を入力してください';
      } else if (adminPassword !== adminPasswordConfirm) {
        errors.adminPasswordConfirm = 'パスワードが一致しません';
      }

      // 利用規約
      if (!document.getElementById('termsCheckbox').checked) {
        errors.terms = '利用規約に同意する必要があります';
      }

      // プライバシーポリシー
      if (!document.getElementById('privacyCheckbox').checked) {
        errors.privacy = 'プライバシーポリシーに同意する必要があります';
      }

      return errors;
    }

    /**
     * エラーメッセージを表示
     */
    function displayErrors(errors) {
      clearErrors();

      if (errors.orgName) {
        document.getElementById('orgNameError').textContent = errors.orgName;
        document.getElementById('orgNameError').classList.add('show');
      }

      if (errors.adminName) {
        document.getElementById('adminNameError').textContent = errors.adminName;
        document.getElementById('adminNameError').classList.add('show');
      }

      if (errors.adminEmail) {
        document.getElementById('adminEmailError').textContent = errors.adminEmail;
        document.getElementById('adminEmailError').classList.add('show');
      }

      if (errors.adminPassword) {
        document.getElementById('adminPasswordError').textContent = errors.adminPassword;
        document.getElementById('adminPasswordError').classList.add('show');
      }

      if (errors.adminPasswordConfirm) {
        document.getElementById('adminPasswordConfirmError').textContent = errors.adminPasswordConfirm;
        document.getElementById('adminPasswordConfirmError').classList.add('show');
      }

      if (errors.terms) {
        document.getElementById('termsError').textContent = errors.terms;
        document.getElementById('termsError').classList.add('show');
      }

      if (errors.privacy) {
        document.getElementById('privacyError').textContent = errors.privacy;
        document.getElementById('privacyError').classList.add('show');
      }

      // スクロールしてエラーが見えるようにする
      window.scrollTo(0, 0);
    }

    /**
     * エラーメッセージをクリア
     */
    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => {
        el.classList.remove('show');
        el.textContent = '';
      });
      document.getElementById('successMessage').classList.remove('show');
    }

    // ページ読み込み時、既存のアカウント情報があればダッシュボードにリダイレクト
    window.addEventListener('load', () => {
      const accountId = localStorage.getItem('accountId');
      if (accountId) {
        // すでにアカウントが存在する場合はダッシュボードへ
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
